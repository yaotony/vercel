version: '3.8'

services:
  # Streamlit 儀表板服務
  autopost-dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: autopost-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ../src/config/config.yaml:/app/src/config/config.yaml:ro
      - ../hugo-site:/app/hugo-site
      - ../logs:/app/logs
      - autopost_images:/app/hugo-site/static/images
    environment:
      - PYTHONPATH=/app/src
      - TZ=Asia/Taipei
    restart: unless-stopped
    networks:
      - autopost-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 自動生成服務 (排程執行)
  autopost-generator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: autopost-generator
    volumes:
      - ../src/config/config.yaml:/app/src/config/config.yaml:ro
      - ../hugo-site:/app/hugo-site
      - ../logs:/app/logs
      - autopost_images:/app/hugo-site/static/images
    environment:
      - PYTHONPATH=/app/src
      - TZ=Asia/Taipei
    command: python src/main.py --mode=auto --count=3
    restart: unless-stopped
    networks:
      - autopost-network
    depends_on:
      - autopost-dashboard

  # Nginx 反向代理 (可選)
  nginx:
    image: nginx:alpine
    container_name: autopost-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../ssl:/etc/nginx/ssl:ro  # SSL 憑證目錄
    depends_on:
      - autopost-dashboard
    restart: unless-stopped
    networks:
      - autopost-network

volumes:
  autopost_images:
    driver: local

networks:
  autopost-network:
    driver: bridge